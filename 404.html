<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Page Not Found — Stackly Yoga &amp; Wellness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage:       #7a9e7e;
      --sage-light: #b5cfb7;
      --clay:       #c9795a;
      --cream:      #f5f0e8;
      --deep:       #1a1a2e;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
      --nav-h: 72px;
      --radius: 4px;
      --transition: all 0.35s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: #000;
      color: var(--cream);
      overflow-x: hidden;
      display: flex; flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }


    /* ── FULL-VIEWPORT HERO ── */
    main {
      flex: 1;
      position: relative;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* Background image */
    .bg-image {
      position: absolute; inset: 0; z-index: 0;
    }
    .bg-image img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 20%;
      display: block;
    }

    /* Multi-layer dark overlay */
    .bg-overlay {
      position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.55) 50%, rgba(0,0,0,0.72) 100%);
    }

    /* Vignette edges */
    .bg-vignette {
      position: absolute; inset: 0; z-index: 2;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }

    /* Center content */
    .content {
      position: relative; z-index: 3;
      text-align: center;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 24px;
      animation: riseIn 1s ease forwards;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: none; }
    }

    /* Giant 404 */
    .num-404 {
      font-family: var(--font-body);
      font-size: clamp(120px, 24vw, 280px);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.04em;
      color: transparent;
      -webkit-text-stroke: 2px rgba(255,255,255,0.88);
      text-stroke: 2px rgba(255,255,255,0.88);
      user-select: none;
      text-transform: uppercase;
    }

    /* Subtext */
    .sub-label {
      font-size: clamp(11px, 1.8vw, 15px);
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      margin-top: 20px;
    }

    /* Divider */
    .divider {
      width: 48px; height: 2px;
      background: var(--sage);
      margin: 28px auto;
      border-radius: 2px;
    }

    /* Description */
    .desc {
      font-size: 15px;
      line-height: 1.8;
      color: rgba(255,255,255,0.5);
      max-width: 400px;
      margin-bottom: 36px;
    }

    /* Buttons */
    .btn-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn-home {
      background: var(--sage); color: var(--deep);
      padding: 13px 32px; font-size: 12px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      border-radius: 28px; border: none; cursor: pointer;
      transition: var(--transition); display: inline-block;
    }
    .btn-home:hover { background: var(--sage-light); transform: translateY(-2px); }
    .btn-back {
      background: transparent; color: rgba(255,255,255,0.75);
      padding: 12px 32px; font-size: 12px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      border-radius: 28px; border: 1px solid rgba(255,255,255,0.25);
      cursor: pointer; transition: var(--transition); display: inline-block;
    }
    .btn-back:hover { border-color: var(--sage); color: var(--sage); transform: translateY(-2px); }

    /* Bottom strip */
    .bottom-strip {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 4;
      padding: 20px 40px;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      flex-wrap: wrap; gap: 12px;
    }
    .bottom-links { display: flex; gap: 20px; flex-wrap: wrap; }
    .bottom-links a { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.3); transition: color 0.2s; }
    .bottom-links a:hover { color: rgba(255,255,255,0.7); }
    .bottom-copy { font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 0.08em; }

    /* Responsive */
    @media (max-width: 768px) {
      .bottom-strip { padding: 16px 20px; }
      .num-404 { -webkit-text-stroke: 1.5px rgba(255,255,255,0.88); }
    }
    @media (max-width: 480px) {
      .btn-row { flex-direction: column; align-items: center; }
      .btn-home, .btn-back { width: 220px; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>


  <!-- MAIN -->
  <main>

    <!-- Background photo -->
    <div class="bg-image">
      <img src="images/slide6.webp" alt="Yoga class"/>
    </div>
    <div class="bg-overlay"></div>
    <div class="bg-vignette"></div>

    <!-- Centered content -->
    <div class="content">
      <div class="num-404">404</div>
      <p class="sub-label">You're in the wrong place</p>
      <div class="divider"></div>
      <p class="desc">The page you're looking for doesn't exist or has been moved. Let's bring you back to your practice.</p>
      <div class="btn-row">
        <a href="index.html" class="btn-home">← Return Home</a>
        <a href="contact.html" class="btn-back">Contact Support</a>
      </div>
    </div>

    <!-- Bottom strip -->
    <div class="bottom-strip">
      <div class="bottom-links">
        <a href="index.html">Home</a>
        <a href="classes.html">Classes</a>
        <a href="contact.html">Contact</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms &amp; Conditions</a>
      </div>
      <p class="bottom-copy">© 2026 Stackly Yoga &amp; Wellness</p>
    </div>

  </main>

</body>
</html>
